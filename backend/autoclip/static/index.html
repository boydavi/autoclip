<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ATALLA Clipper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ── Design tokens — dark-first (video tool) ── */
:root {
  --bg:        #0d0d10;
  --bg-panel:  #16161c;
  --bg-card:   #1e1e28;
  --bg-input:  #12121a;
  --border:    #2a2a38;
  --border-hi: #3a3a52;
  --fg:        #e2e2f0;
  --fg-muted:  #8888a8;
  --fg-dim:    #4a4a62;
  --amber:     #f59e0b;
  --amber-dim: #78490a;
  --teal:      #0d9488;
  --teal-dim:  #0a4d48;
  --red:       #ef4444;
  --red-dim:   #5c1a1a;
  --green:     #10b981;
  --green-dim: #064e3b;
  --blue:      #6366f1;
  --font-ui:   'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f0f0f5; --bg-panel: #ffffff; --bg-card: #f8f8fd;
    --bg-input: #f4f4fa; --border: #dcdce8; --border-hi: #b8b8d0;
    --fg: #1a1a2e; --fg-muted: #5a5a7a; --fg-dim: #9898b8;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f0f0f5; --bg-panel: #ffffff; --bg-card: #f8f8fd;
  --bg-input: #f4f4fa; --border: #dcdce8; --border-hi: #b8b8d0;
  --fg: #1a1a2e; --fg-muted: #5a5a7a; --fg-dim: #9898b8;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
}
/* ── Header ── */
.hud-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20; flex-shrink: 0;
}
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.logo-mark { width: 28px; height: 28px; background: var(--amber); border-radius: 6px; display: grid; place-items: center; color: #000; font-weight: 700; font-size: 12px; }
.logo-sub { color: var(--fg-muted); font-weight: 400; font-size: 12px; }
.header-spacer { flex: 1; }
.server-status { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); cursor: default; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-dim); }
.status-dot.online  { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse-dot 2s infinite; }
.status-dot.offline { background: var(--red); }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.5} }
.theme-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--fg-muted); border-radius: 6px; padding: 5px 10px; font-size: 12px; font-family: var(--font-mono); cursor: pointer; transition: border-color .15s, color .15s; }
.theme-btn:hover { border-color: var(--border-hi); color: var(--fg); }
/* ── Layout ── */
.hud-body { display: grid; grid-template-columns: 280px 1fr; flex: 1; overflow: hidden; }
/* ── Sidebar ── */
.sidebar { background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
.sidebar-section { padding: 16px; border-bottom: 1px solid var(--border); }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 12px; }
/* Submit form */
.submit-form { display: flex; flex-direction: column; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 500; color: var(--fg-muted); letter-spacing: .03em; }
.url-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; outline: none; transition: border-color .15s; }
.url-input::placeholder { color: var(--fg-dim); }
.url-input:focus { border-color: var(--amber); }
.settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini-select { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 7px 8px; font-size: 12px; font-family: var(--font-ui); outline: none; cursor: pointer; }
.submit-btn { width: 100%; background: var(--amber); color: #000; border: none; border-radius: 6px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity .15s; letter-spacing: .02em; }
.submit-btn:hover { opacity: .88; }
.submit-btn:disabled { opacity: .45; cursor: not-allowed; }
/* Ingest progress */
.ingest-progress { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ingest-label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
.ingest-bar-wrap { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
.ingest-bar-fill { height: 100%; background: var(--amber); border-radius: 99px; animation: ingest-pulse 1.2s ease-in-out infinite; }
@keyframes ingest-pulse { 0%{width:15%} 50%{width:85%} 100%{width:15%} }
/* Job list */
.job-list { display: flex; flex-direction: column; gap: 6px; }
.job-item { padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: border-color .15s, background .15s; display: flex; flex-direction: column; gap: 4px; }
.job-item:hover { border-color: var(--border-hi); }
.job-item.active { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, var(--bg-card)); }
.job-item-top { display: flex; align-items: center; gap: 6px; }
.job-status-badge { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.badge-running { background: color-mix(in srgb, var(--amber) 15%, transparent); color: var(--amber); }
.badge-done    { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
.badge-failed  { background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }
.badge-queued  { background: color-mix(in srgb, var(--blue) 15%, transparent); color: var(--blue); }
.job-item-title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.job-item-meta  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
.empty-jobs { font-size: 12px; color: var(--fg-dim); text-align: center; padding: 16px 0; }
/* ── Main panel ── */
.main-panel { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 24px; overflow-y: auto; }
/* Stats bar */
.stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat-tile { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.stat-value { font-family: var(--font-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); line-height: 1; }
.stat-value.amber { color: var(--amber); }
.stat-value.green { color: var(--green); }
.stat-value.teal  { color: var(--teal); }
.stat-label { font-size: 11px; color: var(--fg-muted); letter-spacing: .04em; }
/* Job card */
.job-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.job-card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.job-card-header .job-meta-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.job-title-main { font-size: 15px; font-weight: 600; }
.job-url-text { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
.provider-pill { display: inline-flex; align-items: center; gap: 5px; background: color-mix(in srgb, var(--blue) 12%, transparent); border: 1px solid color-mix(in srgb, var(--blue) 35%, transparent); color: var(--blue); font-family: var(--font-mono); font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.job-actions { display: flex; gap: 8px; align-items: center; }
.action-btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg-card); color: var(--fg-muted); transition: all .15s; }
.action-btn:hover { border-color: var(--border-hi); color: var(--fg); }
.action-btn.danger:hover { border-color: var(--red); color: var(--red); }
/* Pipeline */
.pipeline { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.pipeline-overall { display: flex; flex-direction: column; gap: 6px; }
.pipeline-overall-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--fg-muted); }
.overall-bar { height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
.overall-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), var(--amber)); transition: width .4s ease; }
.stages { display: flex; gap: 12px; }
.stage { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s; }
.stage.active  { border-color: var(--amber); }
.stage.done    { border-color: color-mix(in srgb, var(--green) 40%, var(--border)); }
.stage.failed  { border-color: var(--red); }
.stage.waiting { opacity: .5; }
.stage-icon { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }
.stage.active  .stage-icon { background: color-mix(in srgb, var(--amber) 15%, transparent); }
.stage.done    .stage-icon { background: color-mix(in srgb, var(--green) 15%, transparent); }
.stage.failed  .stage-icon { background: color-mix(in srgb, var(--red)   15%, transparent); }
.stage.waiting .stage-icon { background: var(--border); }
.stage-name { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-muted); }
.stage.active  .stage-name { color: var(--amber); }
.stage.done    .stage-name { color: var(--green); }
.stage.failed  .stage-name { color: var(--red); }
.stage-msg { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); min-height: 16px; }
.stage-bar { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
.stage-fill { height: 100%; border-radius: 99px; transition: width .3s ease; }
.stage.active .stage-fill { background: var(--amber); }
.stage.done   .stage-fill { background: var(--green); width: 100% !important; }
.stage.failed .stage-fill { background: var(--red); }
/* Log feed */
.log-feed { border-top: 1px solid var(--border); padding: 12px 20px; display: flex; flex-direction: column; gap: 3px; max-height: 130px; overflow-y: auto; font-family: var(--font-mono); font-size: 11px; }
.log-line { display: flex; gap: 10px; }
.log-time { color: var(--fg-dim); white-space: nowrap; }
.log-text { color: var(--fg-muted); min-width: 0; word-break: break-word; }
.log-text.hl { color: var(--amber); }
.log-text.ok { color: var(--green); }
.log-text.er { color: var(--red); }
/* Error banner */
.error-banner { background: var(--red-dim); border: 1px solid var(--red); border-radius: 8px; padding: 14px 16px; display: flex; gap: 12px; }
.error-banner-icon { font-size: 20px; flex-shrink: 0; }
.error-banner-body { display: flex; flex-direction: column; gap: 4px; }
.error-banner-title { font-weight: 600; color: var(--red); }
.error-banner-msg { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); }
/* Clips gallery */
.gallery-section { display: flex; flex-direction: column; gap: 16px; }
.gallery-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.gallery-title { font-size: 16px; font-weight: 600; flex: 1; }
.gallery-meta { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); }
.clips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
.clip-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: border-color .15s, transform .1s; cursor: default; }
.clip-card:hover { border-color: var(--border-hi); transform: translateY(-1px); }
.clip-thumb { aspect-ratio: 9/16; background: var(--bg-card); position: relative; overflow: hidden; max-height: 170px; display: flex; align-items: center; justify-content: center; }
.thumb-canvas { width: 100%; height: 100%; display: block; object-fit: cover; }
.clip-duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.75); color: #fff; font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.clip-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.clip-title-text { font-size: 13px; font-weight: 500; line-height: 1.3; text-wrap: balance; }
.clip-score-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-muted); font-family: var(--font-mono); }
.score-bar { flex: 1; height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
.score-fill { height: 100%; border-radius: 99px; background: var(--amber); }
.score-fill.high { background: var(--green); }
.clip-timing { font-family: var(--font-mono); font-size: 10px; color: var(--fg-dim); }
.clip-actions { padding: 0 12px 12px; display: flex; gap: 6px; }
.clip-btn { flex: 1; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--fg-muted); text-align: center; transition: all .15s; }
.clip-btn:hover { background: var(--bg-card); color: var(--fg); border-color: var(--border-hi); }
.clip-btn.primary { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
.clip-btn.primary:hover { background: var(--teal); color: #000; }
/* Idle / empty states */
.idle-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px 24px; text-align: center; color: var(--fg-muted); }
.idle-icon { font-size: 40px; opacity: .3; }
.idle-title { font-size: 15px; font-weight: 500; }
.idle-sub { font-size: 13px; max-width: 280px; line-height: 1.6; }
/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; flex-shrink: 0; }
/* Toast */
.toast { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); padding: 8px 20px; border-radius: 8px; font-size: 13px; z-index: 99; pointer-events: none; opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }
.toast.info  { background: var(--bg-card); border: 1px solid var(--border); color: var(--fg); }
.toast.ok    { background: var(--green-dim); border: 1px solid var(--green); color: var(--green); }
.toast.err   { background: var(--red-dim); border: 1px solid var(--red); color: var(--red); }
/* Responsive */
@media (max-width: 760px) {
  .hud-body { grid-template-columns: 1fr; overflow: visible; }
  .sidebar { max-height: none; overflow: visible; }
  .stages { flex-direction: column; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .clips-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 440px) {
  .clips-grid { grid-template-columns: 1fr 1fr; }
  .stats-bar { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header class="hud-header">
  <div class="logo">
    <div class="logo-mark">AT</div>
    <span>ATALLA</span>
    <span class="logo-sub">/ Clipper</span>
  </div>
  <div class="header-spacer"></div>
  <div class="server-status" title="localhost:8765">
    <div class="status-dot" id="dot"></div>
    <span id="server-label">connecting…</span>
  </div>
  <button class="theme-btn" onclick="toggleTheme()">⊙ theme</button>
</header>

<div class="hud-body">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <div class="sidebar-section">
      <div class="section-label">New Job</div>
      <form class="submit-form" id="submit-form" onsubmit="handleSubmit(event)">
        <div class="field">
          <label for="url-input">YouTube URL</label>
          <input id="url-input" class="url-input" type="url" placeholder="https://youtube.com/watch?v=…" autocomplete="off" required>
        </div>
        <div class="settings-row">
          <div class="field">
            <label>Provider</label>
            <select class="mini-select" id="sel-provider"></select>
          </div>
          <div class="field">
            <label>Max clips</label>
            <select class="mini-select" id="sel-clips">
              <option value="5">5</option>
              <option value="10" selected>10</option>
              <option value="15">15</option>
            </select>
          </div>
        </div>
        <div id="ingest-progress" hidden class="ingest-progress">
          <div class="ingest-label" id="ingest-label">Downloading video…</div>
          <div class="ingest-bar-wrap"><div class="ingest-bar-fill"></div></div>
        </div>
        <button class="submit-btn" id="submit-btn" type="submit">▶ Run Pipeline</button>
      </form>
    </div>

    <div class="sidebar-section" style="flex:1;overflow-y:auto;">
      <div class="section-label">Job History</div>
      <div class="job-list" id="job-list">
        <div class="empty-jobs">No jobs yet</div>
      </div>
    </div>

  </aside>

  <!-- ── Main panel ── -->
  <main class="main-panel" id="main-panel">

    <div class="stats-bar">
      <div class="stat-tile"><div class="stat-value amber" id="stat-running">0</div><div class="stat-label">Running</div></div>
      <div class="stat-tile"><div class="stat-value green" id="stat-done">0</div><div class="stat-label">Completed</div></div>
      <div class="stat-tile"><div class="stat-value teal"  id="stat-clips">0</div><div class="stat-label">Clips Generated</div></div>
      <div class="stat-tile"><div class="stat-value"       id="stat-queued">0</div><div class="stat-label">Queued</div></div>
    </div>

    <div id="job-detail">
      <div class="idle-state">
        <div class="idle-icon">🎬</div>
        <div class="idle-title">No job selected</div>
        <div class="idle-sub">Paste a YouTube URL and press Run Pipeline, or click a job in the history list.</div>
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ── Theme ──────────────────────────────────────────────────────────────────
function toggleTheme() {
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  r.setAttribute('data-theme', next);
  try { localStorage.setItem('atalla-theme', next); } catch(_){}
}
try { const t = localStorage.getItem('atalla-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(_){}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, kind = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${kind} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2800);
}

// ── API helpers ────────────────────────────────────────────────────────────
const API = '';  // same origin

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || JSON.stringify(err));
  }
  if (res.status === 204) return null;
  return res.json();
}

// ── State ──────────────────────────────────────────────────────────────────
let jobs = [];          // JobOut[]
let activeJobId = null; // which job is shown in detail
let sseSource = null;   // current EventSource
let sseJobId = null;    // job the EventSource is attached to
let allClipsCount = 0;
let countedJobIds = new Set();
let pollTimer = null;

// ── Server health ──────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const h = await api('GET', '/api/health');
    document.getElementById('dot').className = 'status-dot online';
    document.getElementById('server-label').textContent = `localhost:8765 · v${h.version}`;
    return true;
  } catch {
    document.getElementById('dot').className = 'status-dot offline';
    document.getElementById('server-label').textContent = 'offline';
    return false;
  }
}

// ── Settings (provider list) ───────────────────────────────────────────────
async function loadSettings() {
  try {
    const s = await api('GET', '/api/settings');
    const sel = document.getElementById('sel-provider');
    const active = s.active_provider;
    const providers = Object.keys(s.providers || {});
    sel.innerHTML = providers.map(p =>
      `<option value="${p}"${p === active ? ' selected' : ''}>${p}</option>`
    ).join('');
  } catch {
    document.getElementById('sel-provider').innerHTML = '<option value="">groq</option>';
  }
}

// ── Job list polling ───────────────────────────────────────────────────────
async function refreshJobs() {
  try {
    const fresh = await api('GET', '/api/jobs?limit=50');
    jobs = fresh;
    renderJobList();
    updateStats();
    // If we have an active running job but no SSE, open one
    if (activeJobId) {
      const j = jobs.find(x => x.id === activeJobId);
      if (j && (j.status === 'running' || j.status === 'queued') && sseJobId !== activeJobId) {
        openSSE(activeJobId);
      }
    }
  } catch { /* server offline — already shown by dot */ }
}

function scheduleRefresh() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => { await refreshJobs(); scheduleRefresh(); }, 5000);
}

// ── Stats ──────────────────────────────────────────────────────────────────
function updateStats() {
  const running = jobs.filter(j => j.status === 'running').length;
  const done    = jobs.filter(j => j.status === 'done').length;
  const queued  = jobs.filter(j => j.status === 'queued').length;
  document.getElementById('stat-running').textContent = running;
  document.getElementById('stat-done').textContent    = done;
  document.getElementById('stat-queued').textContent  = queued;
  document.getElementById('stat-clips').textContent   = allClipsCount;
}

// ── Job list rendering ─────────────────────────────────────────────────────
function renderJobList() {
  const list = document.getElementById('job-list');
  if (!jobs.length) { list.innerHTML = '<div class="empty-jobs">No jobs yet</div>'; return; }
  list.innerHTML = jobs.map(j => {
    const title = j.source?.title || j.source_id.slice(0,12) + '…';
    const metaParts = [j.id.slice(0,8), j.provider];
    if (j.status === 'done' && j.finished_at) {
      const ago = elapsedSince(j.finished_at);
      metaParts.push(ago ? ago + ' ago' : '');
    } else if (j.status === 'running') {
      metaParts.push(elapsedSince(j.started_at || j.created_at));
    } else if (j.status === 'queued') {
      const pos = jobs.filter(x => x.status === 'queued').indexOf(j) + 1;
      metaParts.push('position ' + pos);
    } else if (j.status === 'failed') {
      metaParts.push('failed');
    }
    const badge = badgeHtml(j.status);
    return `<div class="job-item${j.id === activeJobId ? ' active' : ''}" onclick="selectJob('${j.id}')">
      <div class="job-item-top">${badge}</div>
      <div class="job-item-title">${esc(title)}</div>
      <div class="job-item-meta">${metaParts.filter(Boolean).join(' · ')}</div>
    </div>`;
  }).join('');
}

function badgeHtml(status) {
  const map = {
    running:  ['badge-running', '<span class="spinner"></span> RUNNING'],
    queued:   ['badge-queued',  '⏳ QUEUED'],
    done:     ['badge-done',    '✓ DONE'],
    failed:   ['badge-failed',  '✕ FAILED'],
    cancelled:['badge-failed',  '✕ CANCELLED'],
  };
  const [cls, label] = map[status] || ['badge-queued', status.toUpperCase()];
  return `<span class="job-status-badge ${cls}">${label}</span>`;
}

// ── Select a job to view ───────────────────────────────────────────────────
async function selectJob(jobId) {
  activeJobId = jobId;
  renderJobList();
  const j = jobs.find(x => x.id === jobId);
  if (!j) return;
  if (j.status === 'done') {
    await renderDoneView(j);
  } else if (j.status === 'failed' || j.status === 'cancelled') {
    renderFailedView(j);
  } else {
    renderRunningView(j);
    if (sseJobId !== jobId) openSSE(jobId);
  }
}

// ── SSE stream ─────────────────────────────────────────────────────────────
function openSSE(jobId) {
  if (sseSource) { sseSource.close(); sseSource = null; }
  sseJobId = jobId;
  const es = new EventSource(`/api/jobs/${jobId}/events`);
  sseSource = es;

  es.addEventListener('snapshot', e => {
    try {
      const job = JSON.parse(e.data);
      updateJobInList(job);
      if (activeJobId === jobId) renderRunningView(job);
    } catch(_) {}
  });

  es.addEventListener('progress', e => {
    try {
      const d = JSON.parse(e.data);
      updateProgressUI(d);
      addLog(d.message, '');
    } catch(_) {}
  });

  es.addEventListener('done', e => {
    es.close(); sseSource = null; sseJobId = null;
    refreshJobs().then(() => {
      if (activeJobId === jobId) {
        const j = jobs.find(x => x.id === jobId);
        if (j) renderDoneView(j);
      }
    });
  });

  es.addEventListener('failed', e => {
    es.close(); sseSource = null; sseJobId = null;
    refreshJobs().then(() => {
      if (activeJobId === jobId) {
        const j = jobs.find(x => x.id === jobId);
        if (j) renderFailedView(j);
      }
    });
  });

  es.addEventListener('cancelled', e => {
    es.close(); sseSource = null; sseJobId = null;
    refreshJobs();
  });

  es.onerror = () => {
    // SSE will reconnect automatically; ignore transient errors
  };
}

function updateJobInList(updatedJob) {
  const idx = jobs.findIndex(j => j.id === updatedJob.id);
  if (idx >= 0) jobs[idx] = updatedJob;
  else jobs.unshift(updatedJob);
  renderJobList();
  updateStats();
}

// ── Progress UI update (from SSE progress events) ─────────────────────────
const STAGE_KEYS = ['transcribe', 'highlights', 'render'];

function updateProgressUI(d) {
  // d: {stage, stage_progress, overall, message, job_id, type}
  const overall = Math.round((d.overall || 0) * 100);
  setEl('overall-pct', overall + '%');
  setStyle('bar-overall', 'width', overall + '%');

  const stageKey = (d.stage || '').toLowerCase().replace(/[^a-z]/g, '');
  const stageMap = { transcribe:'transcribe', highlights:'highlights', render:'render', export:'render' };
  const mapped = stageMap[stageKey] || stageKey;

  STAGE_KEYS.forEach(k => {
    const el = document.getElementById('stage-' + k);
    if (!el) return;
    if (k === mapped) {
      el.className = 'stage active';
      setStyle('fill-' + k, 'width', Math.round((d.stage_progress || 0) * 100) + '%');
      setEl('msg-' + k, d.message || '');
    } else if (STAGE_KEYS.indexOf(k) < STAGE_KEYS.indexOf(mapped)) {
      el.className = 'stage done';
    }
  });
}

// ── Render: Running job ────────────────────────────────────────────────────
function renderRunningView(job) {
  const title  = job.source?.title || job.source_id;
  const url    = job.source?.url   || '';
  const pct    = Math.round((job.progress || 0) * 100);
  const stage  = (job.current_stage || 'queued').toLowerCase();
  const stageMap = { transcribe:'transcribe', highlights:'highlights', render:'render' };
  const mapped   = stageMap[stage] || '';

  function stageClass(k) {
    const ki = STAGE_KEYS.indexOf(k), mi = STAGE_KEYS.indexOf(mapped);
    if (k === mapped) return 'stage active';
    if (ki < mi) return 'stage done';
    return 'stage waiting';
  }

  document.getElementById('job-detail').innerHTML = `
    <div class="job-card">
      <div class="job-card-header">
        <div class="job-meta-col">
          <div class="job-title-main">${esc(title)}</div>
          <div class="job-url-text">${esc(url)}</div>
        </div>
        <span class="provider-pill">${esc(job.provider)} · ${esc(job.source?.channel || '')}</span>
        <div class="job-actions">
          ${job.status === 'running' || job.status === 'queued'
            ? `<button class="action-btn danger" onclick="cancelJob('${job.id}')">Cancel</button>`
            : ''}
        </div>
      </div>
      <div class="pipeline">
        <div class="pipeline-overall">
          <div class="pipeline-overall-row">
            <span>Overall progress</span>
            <span id="overall-pct" style="font-family:var(--font-mono);color:var(--amber);">${pct}%</span>
          </div>
          <div class="overall-bar"><div class="overall-fill" id="bar-overall" style="width:${pct}%;"></div></div>
        </div>
        <div class="stages">
          <div class="${stageClass('transcribe')}" id="stage-transcribe">
            <div class="stage-icon">🎙</div>
            <div class="stage-name">Transcribe</div>
            <div class="stage-msg" id="msg-transcribe">Groq Whisper</div>
            <div class="stage-bar"><div class="stage-fill" id="fill-transcribe" style="width:${mapped==='transcribe'? Math.round(job.progress*100)+'%':'0%'};"></div></div>
          </div>
          <div class="${stageClass('highlights')}" id="stage-highlights">
            <div class="stage-icon">✦</div>
            <div class="stage-name">Highlights</div>
            <div class="stage-msg" id="msg-highlights">LLM window scoring</div>
            <div class="stage-bar"><div class="stage-fill" id="fill-highlights" style="width:0%;"></div></div>
          </div>
          <div class="${stageClass('render')}" id="stage-render">
            <div class="stage-icon">🎬</div>
            <div class="stage-name">Render</div>
            <div class="stage-msg" id="msg-render">ffmpeg · mediapipe</div>
            <div class="stage-bar"><div class="stage-fill" id="fill-render" style="width:0%;"></div></div>
          </div>
        </div>
      </div>
      <div class="log-feed" id="log-feed"></div>
    </div>`;
}

// ── Render: Done job (clips gallery) ──────────────────────────────────────

function clipCardHtml(c, i) {
  i = i || 0;
  const dur  = fmtDur(c.duration_s);
  const pct  = Math.min(100, c.score);
  const high = c.score >= 85;
  const t    = fmtTime(c.start_s) + ' – ' + fmtTime(c.end_s);
  const exportHref = c.exports && c.exports.length > 0 ? c.exports[0].download_url : null;
  // data-clip-idx / data-clip-id used by addEventListener below — no inline handlers with server data
  return `<div class="clip-card">
    <div class="clip-thumb">
      <canvas class="thumb-canvas" id="clip-canvas-${i}" width="180" height="320"></canvas>
      <div class="clip-duration">${dur}</div>
    </div>
    <div class="clip-info">
      <div class="clip-title-text">${esc(c.title)}</div>
      <div class="clip-score-row">
        <span>${c.score}</span>
        <div class="score-bar"><div class="score-fill${high?' high':''}" style="width:${pct}%;"></div></div>
      </div>
      <div class="clip-timing">${t}</div>
    </div>
    <div class="clip-actions">
      ${exportHref
        ? `<a class="clip-btn primary" href="${exportHref}" target="_blank">Download</a>`
        : `<button class="clip-btn primary" data-export-id="${esc(c.id)}">Export</button>`}
      <button class="clip-btn" data-clip-idx="${i}">Copy title</button>
    </div>
  </div>`;
}

async function renderDoneView(job) {
  const title = job.source?.title || job.source_id;
  const dur   = job.finished_at ? elapsedSince(job.finished_at) + ' ago' : '';

  let clips = [];
  try { clips = await api('GET', `/api/jobs/${job.id}/clips`); } catch(e) { toast('Could not load clips: ' + e.message, 'err'); }

  if (!countedJobIds.has(job.id)) {
    allClipsCount += clips.length;
    countedJobIds.add(job.id);
    updateStats();
  }

  document.getElementById('job-detail').innerHTML = `
    <div class="gallery-section">
      <div class="gallery-header">
        <div class="gallery-title">${esc(title)}</div>
        <div class="gallery-meta">${clips.length} clips · ${esc(job.provider)} · ${dur}</div>
      </div>
      ${clips.length === 0
        ? '<div class="idle-state"><div class="idle-icon">🔍</div><div class="idle-title">No clips found</div><div class="idle-sub">The highlight detector found no clips above the score threshold. Try adjusting min/max duration or use a longer video.</div></div>'
        : `<div class="clips-grid">${clips.map((c, i) => clipCardHtml(c, i)).join('')}</div>`}
    </div>`;

  // Attach listeners after innerHTML — avoids any inline-handler XSS via server data
  document.querySelectorAll('[data-clip-idx]').forEach(btn => {
    btn.addEventListener('click', () => copyClipTitle(clips[+btn.dataset.clipIdx].title));
  });
  document.querySelectorAll('[data-export-id]').forEach(btn => {
    btn.addEventListener('click', function() { exportClip(btn.dataset.exportId, btn); });
  });

  clips.forEach((_, i) => {
    const canvas = document.getElementById('clip-canvas-' + i);
    if (canvas) drawThumb(canvas, i, clips[i].score);
  });
}

// ── Render: Failed job ─────────────────────────────────────────────────────
function renderFailedView(job) {
  const title = job.source?.title || job.source_id;
  const msg   = job.error || 'An unknown error occurred.';
  const stageKeys = ['transcribe', 'highlights', 'render'];
  const stageIcons = { transcribe: '🎙', highlights: '✦', render: '🎬' };
  const stageLabels = { transcribe: 'Transcribe', highlights: 'Highlights', render: 'Render' };
  const rawStage = (job.current_stage || 'highlights').toLowerCase().replace(/[^a-z]/g, '');
  const stageMap = { transcribe: 'transcribe', highlights: 'highlights', render: 'render' };
  const failedKey = stageMap[rawStage] || 'highlights';
  const failedIdx = stageKeys.indexOf(failedKey);

  const stageHtml = stageKeys.map((k, i) => {
    if (i < failedIdx) {
      return `<div class="stage done"><div class="stage-icon">${stageIcons[k]}</div><div class="stage-name">${stageLabels[k]}</div><div class="stage-msg">Complete</div><div class="stage-bar"><div class="stage-fill"></div></div></div>`;
    } else if (k === failedKey) {
      return `<div class="stage failed"><div class="stage-icon">✕</div><div class="stage-name">${stageLabels[k]}</div><div class="stage-msg">${esc(msg.slice(0, 80))}</div><div class="stage-bar"><div class="stage-fill"></div></div></div>`;
    } else {
      return `<div class="stage waiting"><div class="stage-icon">${stageIcons[k]}</div><div class="stage-name">${stageLabels[k]}</div><div class="stage-msg">Skipped</div><div class="stage-bar"><div class="stage-fill"></div></div></div>`;
    }
  }).join('');

  document.getElementById('job-detail').innerHTML = `
    <div class="job-card">
      <div class="job-card-header">
        <div class="job-meta-col">
          <div class="job-title-main">${esc(title)}</div>
          <div class="job-url-text">${esc(job.source?.url || '')}</div>
        </div>
        <div class="job-actions">
          <button class="action-btn" onclick="retryJob('${job.id}')">↺ Retry</button>
        </div>
      </div>
      <div class="pipeline" style="gap:12px;">
        <div class="error-banner">
          <div class="error-banner-icon">⚠</div>
          <div class="error-banner-body">
            <div class="error-banner-title">Job ${job.status}</div>
            <div class="error-banner-msg">${esc(msg)}</div>
          </div>
        </div>
        <div class="stages">${stageHtml}</div>
      </div>
    </div>`;
}

// ── Submit: ingest + create job ───────────────────────────────────────────
let ingestPollTimer = null;

async function handleSubmit(e) {
  e.preventDefault();
  const url  = document.getElementById('url-input').value.trim();
  const provider = document.getElementById('sel-provider').value;
  const maxClips = parseInt(document.getElementById('sel-clips').value, 10);
  if (!url) return;

  setSubmitting(true, 'Downloading video…');
  showIngestProgress('Submitting to yt-dlp…');

  let sourceId;
  try {
    const resp = await api('POST', '/api/sources/youtube', { url });
    sourceId = resp.id;
    if (resp.ingest_status === 'ready') {
      await createJobForSource(sourceId, provider, maxClips);
      return;
    }
    // Poll until ready
    await pollIngestReady(sourceId, provider, maxClips);
  } catch(err) {
    toast(err.message, 'err');
    hideIngestProgress();
    setSubmitting(false);
  }
}

async function pollIngestReady(sourceId, provider, maxClips) {
  let delay = 1000;
  const deadline = Date.now() + 10 * 60 * 1000; // 10 min timeout
  while (Date.now() < deadline) {
    await sleep(delay);
    delay = Math.min(delay * 1.5, 8000);
    try {
      const src = await api('GET', '/api/sources/' + sourceId);
      if (src.ingest_status === 'ready') {
        await createJobForSource(sourceId, provider, maxClips);
        return;
      }
      if (src.ingest_status === 'failed') {
        throw new Error('Download failed: ' + (src.ingest_error || 'unknown error'));
      }
      const elapsed = Math.round((Date.now() - (new Date(src.created_at).getTime())) / 1000);
      showIngestProgress(`Downloading… ${elapsed}s elapsed`);
    } catch(e) {
      if (e.message.startsWith('Download failed')) throw e;
      // network blip, keep polling
    }
  }
  throw new Error('Ingest timed out after 10 minutes.');
}

async function createJobForSource(sourceId, provider, maxClips) {
  showIngestProgress('Creating pipeline job…');
  const settings = {};
  if (provider) settings.provider = provider;
  if (maxClips)  settings.max_clips = maxClips;
  const job = await api('POST', '/api/jobs', { source_id: sourceId, settings });
  hideIngestProgress();
  setSubmitting(false);
  document.getElementById('url-input').value = '';
  toast('Job queued: ' + job.id.slice(0,8), 'ok');

  // Prepend to local list and select it
  jobs.unshift(job);
  renderJobList();
  updateStats();
  activeJobId = job.id;
  renderRunningView(job);
  renderJobList(); // re-render with active state
  openSSE(job.id);
  await refreshJobs();
}

// ── Cancel / Retry ─────────────────────────────────────────────────────────
async function cancelJob(jobId) {
  try {
    await api('POST', `/api/jobs/${jobId}/cancel`);
    toast('Job cancelled', 'ok');
    await refreshJobs();
    const j = jobs.find(x => x.id === jobId);
    if (j) renderFailedView({ ...j, status: 'cancelled', error: 'Cancelled by user' });
  } catch(e) { toast(e.message, 'err'); }
}

async function retryJob(jobId) {
  try {
    await api('POST', `/api/jobs/${jobId}/retry`);
    toast('Job requeued', 'ok');
    await refreshJobs();
    const j = jobs.find(x => x.id === jobId);
    if (j) { renderRunningView(j); openSSE(jobId); }
  } catch(e) { toast(e.message, 'err'); }
}

// ── Export a clip ──────────────────────────────────────────────────────────
async function exportClip(clipId, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Rendering…'; }
  toast('Rendering clip — this may take a minute…', 'ok');
  try {
    const exp = await api('POST', `/api/clips/${clipId}/export`, { ratio: '9:16', style: 'bold_pop' });
    // Export is async (202); poll until status leaves 'pending'
    let record = exp;
    while (record.status === 'pending') {
      await new Promise(r => setTimeout(r, 1500));
      record = await api('GET', `/api/exports/${exp.id}`);
    }
    if (record.status === 'failed') throw new Error(record.error || 'Export failed');
    toast('Export ready', 'ok');
    if (record.download_url) window.open(record.download_url, '_blank');
    if (btn) { btn.textContent = 'Download'; btn.onclick = () => window.open(record.download_url, '_blank'); btn.disabled = false; }
  } catch(e) {
    toast(e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Export'; }
  }
}

function copyClipTitle(title) {
  navigator.clipboard.writeText(title).then(() => toast('Title copied', 'ok')).catch(() => toast('Copy failed', 'err'));
}

// ── Log feed ───────────────────────────────────────────────────────────────
function addLog(text, cls) {
  const feed = document.getElementById('log-feed');
  if (!feed) return;
  const now = new Date();
  const ts  = now.toTimeString().slice(0,8);
  const line = document.createElement('div');
  line.className = 'log-line';
  line.innerHTML = `<span class="log-time">${ts}</span><span class="log-text ${cls}">${esc(text)}</span>`;
  feed.appendChild(line);
  if (feed.children.length > 200) feed.removeChild(feed.firstChild);
  feed.scrollTop = feed.scrollHeight;
}

// ── Thumbnail canvas art ───────────────────────────────────────────────────
const THUMB_PALETTES = [
  ['#e07a20','#0d7a6e'], ['#e0204a','#20b0e0'],
  ['#2040e0','#6020e0'], ['#505070','#909090'],
];
function drawThumb(canvas, idx, score) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const [c1] = THUMB_PALETTES[idx % THUMB_PALETTES.length];
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#1a1a2a'); g.addColorStop(1, '#0a0a15');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#2a2a3a';
  ctx.beginPath(); ctx.ellipse(w/2, h*.32, 35, 35, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#323248';
  ctx.beginPath(); ctx.ellipse(w/2, h*.72, 60, 85, 0, 0, Math.PI*2); ctx.fill();
  const ov = ctx.createLinearGradient(0, h*.5, 0, h);
  ov.addColorStop(0, 'rgba(0,0,0,0)'); ov.addColorStop(1, 'rgba(0,0,0,.82)');
  ctx.fillStyle = ov; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = c1; ctx.fillRect(0, Math.round(h*.63), w, 5);
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function setSubmitting(busy, label) {
  const btn = document.getElementById('submit-btn');
  btn.disabled = busy;
  btn.textContent = busy ? '…' + (label || '') : '▶ Run Pipeline';
}
function showIngestProgress(msg) {
  document.getElementById('ingest-progress').hidden = false;
  document.getElementById('ingest-label').textContent = msg;
}
function hideIngestProgress() {
  document.getElementById('ingest-progress').hidden = true;
}
function setEl(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt; }
function setStyle(id, prop, val) { const el = document.getElementById(id); if (el) el.style[prop] = val; }
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function fmtDur(s) {
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function fmtTime(s) {
  const m = Math.floor(s / 60), sec = Math.round(s % 60);
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function elapsedSince(iso) {
  if (!iso) return '';
  const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return diff + 's';
  if (diff < 3600) return Math.floor(diff/60) + 'm';
  return Math.floor(diff/3600) + 'h';
}

// ── Boot ───────────────────────────────────────────────────────────────────
(async () => {
  await checkHealth();
  await loadSettings();
  await refreshJobs();
  scheduleRefresh();
  setInterval(checkHealth, 30000);
  // Show most recent running job automatically
  const running = jobs.find(j => j.status === 'running');
  const queued  = jobs.find(j => j.status === 'queued');
  const latest  = running || queued || jobs[0];
  if (latest) selectJob(latest.id);
})();
